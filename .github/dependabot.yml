# Weekly pull requests for the Gradle version catalog and the GitHub Actions
# the workflows use, so the toolchain does not drift unnoticed. Each update
# goes through the full CI matrix like any other change.
version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      androidx:
        patterns:
          - "androidx.*"
      kotlin:
        patterns:
          - "org.jetbrains.kotlin*"
          - "org.jetbrains.kotlinx*"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
