name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:

  # ── Build, lint, JVM tests, screenshots ──────────────────────────────────────
  build:
    name: Build, lint, tests, screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle

      - name: Engine tests (pure JVM)
        run: ./gradlew :engine:test

      - name: Lint
        run: ./gradlew lintDebug

      - name: App unit tests
        run: ./gradlew :app:testDebugUnitTest

      - name: Validate Compose preview screenshots
        run: ./gradlew :app:validateDebugScreenshotTest

      - name: Upload screenshot test report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: screenshot-test-report
          path: app/build/reports/screenshotTest/preview/debug/

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

  # ── Auto Play bench: seeded campaigns on the JVM, a regression guard ─────────
  autoplay-bench:
    name: Auto Play bench
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle

      - name: Play seeded campaigns on a portrait phone
        run: ./gradlew :engine:run --args="--runs 100 --levels --campaigns --min-campaign-win 95" -q

      - name: Play seeded campaigns on a landscape screen
        run: ./gradlew :engine:run --args="--width 2400 --height 1080 --runs 50 --levels --campaigns --min-campaign-win 95" -q

  # ── Instrumented tests on phone, foldable and TV emulators ──────────────────
  instrumented:
    name: Instrumented (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: phone API 34
            api-level: 34
            target: google_apis
            profile: pixel_6
          - name: foldable API 36
            api-level: 36
            target: google_apis
            profile: 7.6in Foldable
          - name: TV API 36
            api-level: 36
            target: android-tv
            profile: tv_1080p

    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle

      - name: Enable KVM for hardware-accelerated emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run instrumented tests on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: ${{ matrix.target }}
          profile: "${{ matrix.profile }}"
          force-avd-creation: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -verbose -show-kernel -debug-metrics -metrics-collection
          disable-animations: true
          emulator-boot-timeout: 900
          script: |
            adb wait-for-device
            adb logcat -v time > "${{ github.workspace }}/emulator_logcat.txt" &
            ./gradlew :app:connectedDebugAndroidTest --no-daemon

      - name: Dump guest logcat on failure
        if: failure()
        run: tail -n 800 "${{ github.workspace }}/emulator_logcat.txt" 2>/dev/null || echo "no logcat captured"

      - name: Upload instrumented test report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: instrumented-test-report-${{ matrix.api-level }}-${{ matrix.profile }}
          path: app/build/reports/androidTests/connected/
